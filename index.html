#pauseBtn{position:absolute;top:10px;left:10px;width:34px;height:34px;border-radius:8px;border:none;background:rgba(255,255,255,.12);color:#fff;font-size:1rem;cursor:pointer;z-index:3}

#overlay p{color:#b8c9cc;line-height:1.9;font-size:.92rem}
.btn{padding:12px 28px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--gold),#d97706);color:#000;font-weight:900;font-size:1rem;font-family:inherit;cursor:pointer}
.btn2{padding:8px 16px;border-radius:10px;border:1px solid #44585c;background:transparent;color:var(--text);font-family:inherit;cursor:pointer}
.inrow{display:flex;gap:8px;width:100%;margin-top:8px;direction:ltr}
#inp{flex:1;padding:13px;border-radius:12px;border:1px solid #3a4b4f;background:#10222a;color:#fff;font-size:1.1rem;font-family:'Space Mono',monospace;outline:none}
#inp:focus{border-color:var(--gold)}
#inp.shake{animation:sh .3s;border-color:var(--red)}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.mic{padding:0 18px;border-radius:12px;border:1px solid var(--blue);background:rgba(96,165,250,.12);color:var(--blue);cursor:pointer;font-size:1.2rem}
.mic.on{background:rgba(248,113,113,.2);border-color:var(--red);color:var(--red);animation:pl 1s infinite}
@keyframes pl{50%{opacity:.55}}
#heard{min-height:20px;margin-top:6px;font-size:.8rem;color:#9fb4b8;font-family:'Space Mono',monospace;direction:ltr;width:100%}
.sb{position:absolute;bottom:12px;width:34px;height:34px;border-radius:8px;border:none;background:rgba(255,255,255,.12);color:#fff;font-size:1rem;cursor:pointer;z-index:3}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%;direction:ltr}
.sg{padding:12px 0;border-radius:10px;border:1px solid #44585c;background:#10222a;color:#fff;font-family:'Space Mono',monospace;font-weight:700;cursor:pointer}
.sg.done{border-color:var(--green);color:var(--green)}.sg.lock{opacity:.35;cursor:not-allowed}

function toggleMus(){musOn=!musOn;$('musBtn').textContent=musOn?'🎵':'🔇'}
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.9;const v=speechSynthesis.getVoices().find(x=>/^en/i.test(x.lang));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}

let G=null,raf=0,last=0,gridY=0;
function overlay(h){const o=$('overlay');o.innerHTML=h;o.classList.remove('hide')}
function menu(inG){let g='';D.forEach((s,i)=>{const lk=i>dn;g+=`<button class="sg ${lk?'lock':i<dn?'done':''}" ${lk?'disabled':`onclick="startGame(${i})"`}>${lk?'🔒':i<dn?'✓':''} ${i+1}</button>`});
  overlay(`<h1>WORD BLAST</h1><p>كل مرحلة 3 أجزاء: 20 كلمة تسقط عشوائيا، ثم 10 جمل تسقط (انطقها أو اكتبها)، ثم 10 جمل عربية تترجمها.<br>4 أخطاء = تعيد المرحلة من بدايتها 🛡️<br>السرعة تزيد مع كل مرحلة وتنخفض قليلا في الجمل، ولكل مرحلة 4 ألحان تتبدل مع تقدمك 🎵<br><span style="color:var(--gold)">Best: ${best} — المراحل المكتملة: ${dn}/${D.length}</span></p><div class="grid">${g}</div>${inG?'<button class="btn2" onclick="resumeG()">▶ متابعة</button>':'<button class="btn" onclick="startGame()">▶ ابدأ</button>'}`)}
function openMap(){if(G&&G.run&&!G.over){G.paused=true;menu(true)}else menu()}
function resumeG(){G.paused=false;$('overlay').classList.add('hide');last=performance.now();$('inp').focus()}
function startGame(i){const st=typeof i=='number'?i:Math.min(dn,D.length-1);
  G={run:1,st,ph:0,qT:0,hint:0,q:null,sub:'',deck:[],ptr:0,words:[],bullets:[],parts:[],stageTotal:0,stageDone:0,lives:4,score:0,combo:0,mul:1,spawnT:.5,banner:0,bannerTxt:'',over:false,paused:false,flash:0,reveal:'',revealT:0,shake:0};
  loadStage(0);$('overlay').classList.add('hide');$('inp').value='';$('inp').focus();last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);musicStart()}
function loadStage(ph){
  G.ph=ph||0;let items;
  if(G.ph==0)items=D[G.st].w.concat(X[G.st]).slice(0,20).map(P);else items=S[G.st].map(SP);
  G.bannerTxt=`STAGE ${G.st+1} · ${['WORDS','SENTENCES','TRANSLATE'][G.ph]}`;
  G.sub=D[G.st].t+' — '+['20 كلمة: اكتبها أو انطقها','10 جمل: اكتبها أو انطقها بالإنجليزية','ترجم الجملة العربية إلى الإنجليزية'][G.ph];
  G.deck=shuffle(items);G.ptr=0;G.stageTotal=items.length;G.stageDone=0;G.banner=2.2;G.spawnT=1.4;G.words=[];G.bullets=[];G.q=null;G.qT=0;G.hint=0;if(G.ph==2)nextQ()}
function nextQ(){G.q=G.deck[G.ptr++]||null;G.hint=0}
function correct(){const q=G.q;G.q=null;explode(W/2,260,'#f7d070',40);G.stageDone++;G.combo++;G.score+=15+Math.min(G.combo,10)*2;beep(900,.1,'square',.05);say(q.raw);G.qT=1.1}
function ans(t,loose){if(!G.q)return false;const v=norm(t);if(!v)return false;if(G.q.en.some(a=>okm(a,v,loose))){correct();return true}return false}
function miss2(){G.lives--;G.combo=0;G.flash=.35;G.shake=.3;G.hint=1;beep(150,.3,'sawtooth',.09);inp.classList.add('shake');setTimeout(()=>inp.classList.remove('shake'),300);if(G.lives<=0)failStage()}
function failStage(){G.lives=4;G.combo=0;G.mul=1;G.flash=.5;G.shake=.5;beep(110,.5,'sawtooth',.1);loadStage(0);G.bannerTxt='4 أخطاء! المرحلة '+(G.st+1)+' من جديد';G.reveal=''}
function advance(){G.score+=50;beep(660,.15);setTimeout(()=>beep(880,.15),150);setTimeout(()=>beep(1180,.25),300);
  if(G.ph<2){loadStage(G.ph+1);return}
  if(G.st+1>dn){dn=G.st+1;try{localStorage.setItem('wb_dn',dn)}catch(e){}}
  if(G.st+1>=D.length){win();return}
  G.st++;G.lives=4;G.mul=1;loadStage(0)}
function win(){G.over=true;stopMic();if(G.score>best){best=G.score;try{localStorage.setItem('wb_best',best)}catch(e){}}draw();overlay(`<h1>🏆 YOU WIN</h1><p>أكملت المراحل العشر!<br>Score: ${G.score}</p><button class="btn" onclick="menu()">☰ المراحل</button>`)}
function wrapT(t,y,lh){const ws=t.split(' ');let l='',ls=[];for(const x of ws){const n=l?l+' '+x:x;if(ctx.measureText(n).width>W-90&&l){ls.push(l);l=x}else l=n}ls.push(l);ls.forEach((s,i)=>ctx.fillText(s,W/2,y+i*lh))}
const baseV=()=>(20+Math.min(G.st,9)*3.2)*(G.ph==1?.68:1);
function spawn(){
  const item=G.deck[G.ptr];ctx.font=`700 ${item.k=='s'?17:24}px Tajawal,sans-serif`;const w=ctx.measureText(item.ar).width+22;
  for(let k=0;k<10;k++){const x=rnd(w/2+8,W-w/2-8);
    if(G.words.every(o=>o.y>70||Math.abs(o.x-x)>(o.w+w)/2+10)){G.ptr++;G.words.push({item,x,y:-24,w,v:rnd(.9,1.15),dying:false,seed:Math.random()*6});return true}}
  return false}
function loop(ts){
  if(!G||G.over)return;const dt=Math.min(.05,(ts-last)/1000);last=ts;
  if(!G.paused)update(dt);draw();raf=requestAnimationFrame(loop)}
function update(dt){
  gridY=(gridY+dt*14)%40;G.mul=Math.min(1.8,G.mul+dt*.0015);
  if(G.banner>0)G.banner-=dt;
  else{G.spawnT-=dt;const maxOn=G.ph==1?3:G.st<2?3:G.st<6?4:5;
    if(G.ph<2&&G.ptr<G.deck.length&&G.words.length<maxOn&&(G.spawnT<=0||!G.words.some(w=>!w.dying))){if(spawn())G.spawnT=Math.max(.9,2.7-G.st*.14)/Math.sqrt(G.mul)*(G.ph==1?1.3:1)}}
  if(G.ph==2&&G.banner<=0){if(G.qT>0){G.qT-=dt;if(G.qT<=0&&G.stageDone<G.stageTotal)nextQ()}else if(!G.q&&G.stageDone<G.stageTotal)nextQ()}
  for(const w of G.words.slice()){
    if(w.dying)continue;w.y+=baseV()*G.mul*w.v*dt;
    if(w.y>=H-96){G.words=G.words.filter(o=>o!==w);explode(w.x,w.y,'#f87171',34);G.deck.push(w.item);G.lives--;G.combo=0;G.shake=.4;G.flash=.35;
      G.reveal=w.item.ar+' = '+w.item.en[0];G.revealT=2;beep(150,.35,'sawtooth',.09);say(w.item.en[0]);if(G.lives<=0){failStage();return}}}
  for(const b of G.bullets.slice()){
    const dx=b.t.x-b.x,dy=b.t.y-b.y,d=Math.hypot(dx,dy),s=1500*dt;
    if(d<=s+8){G.bullets=G.bullets.filter(o=>o!==b);G.words=G.words.filter(o=>o!==b.t);explode(b.t.x,b.t.y,'#f7d070',30);explode(b.t.x,b.t.y,'#ffffff',12);
      G.stageDone++;G.combo++;G.score+=10+Math.min(G.combo,10)*2;G.mul=Math.min(1.8,G.mul+.015);beep(900,.1,'square',.05);beep(300,.2,'sawtooth',.06)}
    else{b.x+=dx/d*s;b.y+=dy/d*s;b.tr.push([b.x,b.y]);if(b.tr.length>6)b.tr.shift()}}
  for(const p of G.parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=260*dt;p.life-=dt}G.parts=G.parts.filter(p=>p.life>0);
  if(G.flash>0)G.flash-=dt;if(G.shake>0)G.shake-=dt;if(G.revealT>0)G.revealT-=dt;
  const fin=G.ph==2?(G.stageDone>=G.stageTotal&&G.qT<=0):(G.ptr>=G.deck.length&&G.words.length==0&&G.bullets.length==0&&G.banner<=0);if(fin&&G.lives>0)advance()}
function explode(x,y,c,n){for(let i=0;i<n;i++){const a=rnd(0,6.28),s=rnd(60,320);G.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,life:rnd(.4,.9),c,r:rnd(1.5,3.5)})}}
function draw(){
  ctx.save();if(G.shake>0)ctx.translate(rnd(-5,5),rnd(-5,5));
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0a1a20');g.addColorStop(1,'#0e2a30');ctx.fillStyle=g;ctx.fillRect(-10,-10,W+20,H+20);
  ctx.strokeStyle='rgba(120,200,210,.07)';ctx.lineWidth=1;
  for(let x=0;x<=W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
  for(let y=-40+gridY;y<=H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
  // words
  ctx.font='700 24px Tajawal,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  for(const w of G.words){
    ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(w.x-w.w/2,w.y-17,w.w,34);
    ctx.strokeStyle=w.dying?'#fff':'rgba(240,180,41,.55)';ctx.strokeRect(w.x-w.w/2,w.y-17,w.w,34);
    const fs=w.item.k=='s'?17:24;ctx.font=`700 ${fs}px Tajawal,sans-serif`;ctx.fillStyle=w.dying?'#fff':'#fff4d6';ctx.fillText(w.item.ar,w.x,w.y+1);
    {const K={v:['فعل','#60a5fa'],n:['اسم','#f0b429'],a:['صفة','#c084fc'],c:['رابط','#34d399']}[w.item.k];if(K){ctx.font='700 11px Tajawal,sans-serif';ctx.fillStyle=K[1];ctx.fillText(K[0],w.x,w.y-24);ctx.font=`700 ${fs}px Tajawal,sans-serif`}}
    ctx.fillStyle='#f0b429';ctx.beginPath();ctx.arc(w.x+w.w/2+6,w.y-14,4,0,6.28);ctx.fill()}
  if(G.ph==2){ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(24,150,W-48,230);ctx.strokeStyle='rgba(240,180,41,.55)';ctx.strokeRect(24,150,W-48,230);ctx.fillStyle='#7b8f93';ctx.font='700 13px Tajawal,sans-serif';ctx.fillText('ترجم إلى الإنجليزية  '+Math.min(G.stageDone+1,G.stageTotal)+'/'+G.stageTotal,W/2,172);
    if(G.q){ctx.fillStyle='#fff4d6';ctx.font='700 28px Tajawal,sans-serif';wrapT(G.q.ar,225,42);if(G.hint){ctx.fillStyle='#f0b429';ctx.font='700 15px Space Mono,monospace';ctx.fillText('💡 '+G.q.raw.split(' ').slice(0,2).join(' ')+' …',W/2,350)}}else{ctx.fillStyle='#34d399';ctx.font='900 26px Tajawal,sans-serif';ctx.fillText('✔ ممتاز',W/2,265)}}
  // bullets
  for(const b of G.bullets){ctx.strokeStyle='#7ff5ff';ctx.lineWidth=3;ctx.beginPath();b.tr.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.lineTo(b.x,b.y);ctx.stroke()}
  // particles
  for(const p of G.parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.28);ctx.fill()}ctx.globalAlpha=1;
  // ship
  let ang=-Math.PI/2;const tg=G.bullets[0]?G.bullets[0].t:null;if(tg)ang=Math.atan2(tg.y-SHIP.y,tg.x-SHIP.x);
  ctx.save();ctx.translate(SHIP.x,SHIP.y);ctx.rotate(ang+Math.PI/2);ctx.fillStyle='#38e8d6';ctx.strokeStyle='#baffff';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(0,-26);ctx.lineTo(16,18);ctx.lineTo(0,10);ctx.lineTo(-16,18);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();
  // typed text
  const typed=$('inp').value;if(typed){ctx.font='700 18px Space Mono,monospace';ctx.fillStyle='#7ff5ff';ctx.fillText(typed,SHIP.x,SHIP.y+44)}
  // HUD
  ctx.textAlign='left';ctx.font='700 16px Space Mono,monospace';ctx.fillStyle='#e8f4f2';ctx.fillText('SCORE '+G.score,56,24);
  ctx.fillStyle='#7b8f93';ctx.font='12px Space Mono,monospace';ctx.fillText('BEST '+Math.max(best,G.score)+'   x'+G.mul.toFixed(2),56,44);ctx.fillText('♪ '+TH[(G.st||0)%TH.length].n+' '+(MV()+1)+'/4',56,60);ctx.fillText('SPEED '+(baseV()*(G.mul||1)/20).toFixed(1)+'x',56,76);
  ctx.textAlign='right';ctx.fillStyle='#f0b429';ctx.font='700 14px Space Mono,monospace';ctx.fillText('STAGE '+(G.st+1)+' · '+['WORDS','SAY','TRANS'][G.ph]+'  '+G.stageDone+'/'+G.stageTotal,W-12,24);
  if(G.combo>2){ctx.fillStyle='#34d399';ctx.fillText('COMBO x'+G.combo,W-12,44)}
  // shield hex
  ctx.save();ctx.translate(W-34,H-40);ctx.beginPath();for(let i=0;i<6;i++){const a=i*Math.PI/3;ctx.lineTo(Math.cos(a)*20,Math.sin(a)*20)}ctx.closePath();ctx.fillStyle=G.lives>1?'#f5c518':'#f87171';ctx.fill();
  ctx.fillStyle='#000';ctx.textAlign='center';ctx.font='700 18px Space Mono,monospace';ctx.fillText(G.lives,0,1);ctx.restore();
  // reveal
  if(G.revealT>0){ctx.globalAlpha=Math.min(1,G.revealT);ctx.fillStyle='#f87171';ctx.textAlign='center';ctx.font='700 18px Space Mono,monospace';ctx.fillText(G.reveal,W/2,H-20);ctx.globalAlpha=1}
  // banner
  if(G.banner>0){ctx.globalAlpha=Math.min(1,G.banner);ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,H/2-50,W,86);ctx.fillStyle='#f0b429';ctx.textAlign='center';ctx.font='900 24px Space Mono,monospace';ctx.fillText(G.bannerTxt,W/2,H/2-8);ctx.fillStyle='#b8c9cc';ctx.font='14px Tajawal,sans-serif';ctx.fillText(G.sub||'',W/2,H/2+20);ctx.globalAlpha=1}
  if(G.flash>0){ctx.fillStyle=`rgba(248,113,113,${G.flash*.5})`;ctx.fillRect(0,0,W,H)}
  ctx.restore()}
function gameOver(){G.over=true;stopMic();let nb='';if(G.score>best){best=G.score;try{localStorage.setItem('wb_best',best)}catch(e){}nb='🏆 رقم قياسي جديد!<br>'}
  draw();overlay(`<h1>GAME OVER</h1><p>${nb}Score: ${G.score}<br>وصلت إلى ${G.st<D.length?'المرحلة '+(G.st+1):'المرحلة اللانهائية'}</p><button class="btn" onclick="startGame()">🔁 العب مرة أخرى</button>`)}
function togglePause(){if(!G||G.over)return;G.paused=!G.paused;if(G.paused)overlay(`<h1>PAUSED</h1><button class="btn" onclick="togglePause()">▶ متابعة</button>`);else{$('overlay').classList.add('hide');last=performance.now();$('inp').focus()}}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G&&!G.over&&!G.paused)togglePause()});
document.addEventListener('keydown',e=>{if(e.key=='Escape')togglePause();else if(G&&!G.over&&!G.paused&&document.activeElement!==$('inp')&&e.key.length==1)$('inp').focus()});

// ---- matching ----
function target(txt,loose){const v=norm(txt);if(!v)return null;let best=null;
  for(const w of G.words){if(w.dying)continue;const ok=w.item.en.some(a=>okm(a,v,loose));if(ok&&(!best||w.y>best.y))best=w}
  return best}
function hit(w){w.dying=true;G.bullets.push({x:SHIP.x,y:SHIP.y,t:w,tr:[]});beep(1400,.06,'square',.04);say(w.item.en[0])}
const inp=$('inp');
inp.addEventListener('input',()=>{if(!G||G.over||G.paused)return;if(G.ph==2){if(ans(inp.value,false))inp.value='';return}const w=target(inp.value,false);if(w){hit(w);inp.value=''}});
inp.addEventListener('keydown',e=>{if(e.key!=='Enter'||!G||G.over||G.paused)return;if(G.ph==2){const t=inp.value.trim();if(t&&G.q&&!ans(t,false))miss2();inp.value='';return}const w=target(inp.value,false);if(w)hit(w);else if(inp.value.trim()){inp.classList.add('shake');setTimeout(()=>inp.classList.remove('shake'),300)}inp.value=''});
// ---- speaking ----
let rec=null;
function toggleMic(){rec?stopMic():startMic()}
function startMic(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('استعمل Chrome أو Edge للنطق');return}
  rec=new SR();rec.lang='en-US';rec.continuous=true;rec.interimResults=true;rec.maxAlternatives=3;
  rec.onresult=e=>{if(!G||G.over||G.paused)return;const r=e.results[e.results.length-1];let h=null,heard='';
    for(let k=0;k<r.length;k++){heard=heard||r[k].transcript;if(G.ph==2){if(ans(r[k].transcript,true)){heard=r[k].transcript;try{rec&&rec.stop()}catch(_){}break}continue}const w=target(r[k].transcript,true);if(w){h=w;heard=r[k].transcript;break}}
    $('heard').textContent='🎧 '+heard;if(h){hit(h);try{rec&&rec.stop()}catch(_){}}};
  rec.onerror=e=>{if(e.error=='not-allowed'||e.error=='service-not-allowed'){alert('اسمح للمتصفح باستعمال الميكروفون');stopMic()}};
  rec.onend=()=>{if(rec){try{rec.start()}catch(_){}}};
  try{rec.start();$('micBtn').classList.add('on')}catch(e){rec=null}}
function stopMic(){const r=rec;rec=null;$('micBtn').classList.remove('on');if(r)try{r.stop()}catch(_){}}
